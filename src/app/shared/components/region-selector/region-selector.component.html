<div class="selector">
  <label for="regiao">{{ textos.labels.region }}</label>
  <span class="selector-icon material-icons" aria-hidden="true">place</span>
  <ng-select
    class="combo-selector"
    [items]="regioes"
    [searchable]="false"
    [placeholder]="regiaoSelecionada ? '' : textos.placeholders.region"
    [(ngModel)]="regiaoSelecionada"
    (change)="onChange()">
  </ng-select>
</div>
