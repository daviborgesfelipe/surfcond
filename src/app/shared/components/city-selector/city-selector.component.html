<div class="selector">
  <label for="cidade">Selecione a cidade:</label>
  <ng-select
    class="combo-selector"
    [items]="cidades"
    [(ngModel)]="cidadeSelecionada"
    (change)="onChange()"
    [disabled]="disabled"
    [notFoundText]="cidades.length === 0 ? 'Selecione uma região primeiro' : 'Nenhuma cidade encontrada'">
  </ng-select>
</div>
